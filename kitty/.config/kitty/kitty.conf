font_family JetBrainsMono Nerd Font mono 
font_size 10

disable_ligatures no
enable_audio_bell no

shell zsh
shell_integration disable

url_style curly

remember_window_size no
window_padding_width 5
dynamic_background_opacity no
background_blur 1
background_opacity 0.75

confirm_os_window_close 0
sync_to_monitor no
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

#==========================
#Layouts and Windows splits
#==========================
enabled_layouts splits,stack

#pane opening/closing
map alt+v launch --location=vsplit --cwd=current
map alt+s launch --location=hsplit --cwd=current
map alt+q close_window

#vim navigation
allow_remote_control yes
listen_on unix:@mykitty
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+h neighboring_window left
map alt+l neighboring_window right

# Unset the mapping to pass the keys to neovim
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+l

#resizing
map alt+left  resize_window wider
map alt+right resize_window narrower
map alt+up    resize_window taller
map alt+down  resize_window shorter

# Toggle maximizing the current split window
map alt+p toggle_layout stack

#visual borders
active_border_color #5082d9
inactive_border_color #282a36

inactive_text_alpha .65
window_margin_width 1 1 1 1
window_border_width 1
