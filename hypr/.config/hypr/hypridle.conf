general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# one for each monitor
listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s -d intel_backlight set 10  # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r -d intel_backlight          # monitor backlight restore.
}
listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s -d card1-eDP-2-backlight set 10  # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r -d card1-eDP-2-backlight          # monitor backlight restore.
}

# lock session
listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# turn off monitors
listener {
    timeout = 450                                                                                  # 2 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

# suspends at 10 minutes, at 15 minutes initiates hibernate
listener {
    timeout = 600                                  # 10min
    on-timeout = systemctl suspend-then-hibernate  # suspend pc
}
