# ==========================================
# HYPRLOCK TTY / EMPTTY RETRO CONFIG
# ==========================================

general{
    hide_cursor = true
}

animations{
    enabled = true
    animation = fade, 0, 0, default
    animation = fadeOut, 0, 0, default
    animation = inputFieldDots, 0, 0, default
}

background {
    monitor =
    color = rgb(0, 0, 0)          # Pure black background turns off OLED pixels
    clear_password = true
}

# The TTY "login:" text simulation
label {
    monitor =
    text = <i> </i><b>_                 _       <br/>| |    ___   __ _ (_)_ __  <br/>| |   / _ \ / _` || | '_ \ <br/>| |__| (_) | (_| || | | | |<br/>|_____\___/ \__, ||_|_| |_|<br/>            |___/</b>
    color = rgb(200, 200, 200)    # Standard terminal gray
    font_size = 22
    font_family = JetBrains Mono  # Use your favorite mono font
    position = 30, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = <b>zenbook login: atlas</b>
    color = rgb(200, 200, 200)
    font_size = 18
    font_family = JetBrains Mono
    position = 30, -330
    halign = left
    valign = top
}

label {
    monitor =
    text = <b>Password:</b>
    color = rgb(200, 200, 200)
    font_size = 18
    font_family = JetBrains Mono
    position = 30, -390           # Placed exactly where your line sits
    halign = left
    valign = top
}

# The Interactive Password Input Box disguised as a TTY prompt
input-field {
    monitor =
    size = 300, 30
    outline_thickness = 0          
    dots_size = 0.8               
    dots_spacing = 0.1 
    dots_center = false

    dots_text_format = *
    
    font_color = rgb(200, 200, 200)
    font_family = JetBrains Mono
    
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    
    # --- FIXED STATE COLORS ---
    check_color = rgba(0, 0, 0, 0)      # Stop the green validation flash
    fail_color = rgb(200, 200, 200)    # Stop the red failure flash (forces gray)
    bothlock_color = rgb(200, 200, 200) # Stop any caps/num lock alert colors
    
    fail_transition = 0            # Intantly snap clear with no visual fading
    
    position = 175, -395           
    halign = left
    valign = top
}
