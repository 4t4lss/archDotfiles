# ==========================================
# HYPRLOCK TTY / EMPTTY RETRO CONFIG
# ==========================================

general{
    hide_cursor = true
}
animations{
    enabled = false
    animation = fade, 0, 0, default
    animation = fadeOut, 0, 0, default
    animation = inputFieldDots, 0, 0, default
}

background{
    monitor = 
    path = /home/atlas/dotfiles/wallpapers/activeWallpaper
    blur_passes = 2
    blur_size = 7
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0    
}
shape {
    monitor =
    size = 620, 750
    color = rgba(50, 50, 50, 0.4)
    rounding = 20
    border_size = 0
    border_color = rgb(255, 255, 255)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 10, -210
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(170,170,170,1.0) 
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 300
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 70, -180
    halign = center
    valign = top
    zindex = 5
}
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(250,250,250,1.0) 
    font_size = 250
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = -70, -520
    halign = center
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = rgba(255, 255, 255, 1)
    font_size = 25
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, 0
    halign = center
    valign = center
    zindex = 5
}
shape {
    monitor =
    size = 320, 55
    color = rgba(50, 50, 50, 0.4)
    rounding = -1
    border_size = 0
    border_color = rgb(255, 255, 255)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, 327
    halign = center
    valign = bottom
}
label {
    monitor =
    text =  $USER
    color = rgb(186, 194, 222)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 340
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(50, 50, 50, 0.4)
    font_color = rgb(205, 214, 244)
    check_color = rgba(0, 0, 0, 0)      # Stop the green validation flash
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##bac2de">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, 250
    halign = center
    valign = bottom
}
